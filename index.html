<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jefferson HiFi Vault</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; text-align: center; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    img { width: 100%; border-radius: 8px; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #aaa; font-size: 0.9rem; margin-bottom: 1.5rem; }
    a.btn { display: inline-block; background: #e72c5b; color: #fff; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <img src="cover.png" alt="Cover">
    <h1>Jefferson HiFi Vault</h1>
    <p>Feed RSS com faixas em áudio Lossless FLAC 1411 kbps para Deezer.</p>
    <a class="btn" href="feed.xml">Acessar Feed RSS</a>
  </div>
</body>
</html>
